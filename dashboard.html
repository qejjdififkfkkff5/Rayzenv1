<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="m.css">


    <meta charset="UTF-8">
    <title>Calculator</title>
</head><div class="calculator">
  <input id="display" type="text" readonly>
  <div class="buttons">
    <button class="clbtn">7</button>
    <button class="clbtn">8</button>
    <button class="clbtn">9</button>
    <button class="clbtn">/</button>

    <button class="clbtn">4</button>
    <button class="clbtn">5</button>
    <button class="clbtn">6</button>
    <button class="clbtn">*</button>

    <button class="clbtn">1</button>
    <button class="clbtn">2</button>
    <button class="clbtn">3</button>
    <button class="clbtn">-</button>

    <button class="clbtn">0</button>
    <button class="clbtn">C</button>
    <button class="clbtn">=</button>
    <button class="clbtn">+</button>
  </div>
</div>
<script src="y.js"></script>
</body>
</html>
